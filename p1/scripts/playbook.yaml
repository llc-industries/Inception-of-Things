---
- name: "Common base"
  hosts: all
  become: true

  tasks:
    - name: Update APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install packets
      ansible.builtin.apt:
        name:
          - curl
          - zsh

    - name: Disable SSH Auth
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-no-password.conf
        content: "PasswordAuthentication no\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload SSH

    - name: Make ZSH default
      ansible.builtin.user:
        name: vagrant
        shell: /bin/zsh

    - name: Configure ZSH
      ansible.builtin.copy:
        dest: /home/vagrant/.zshrc
        content: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          alias k=kubectl
        owner: vagrant
        group: vagrant
        mode: "0644"

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded

- name: "Config master"
  hosts: server
  become: true

  vars:
    server_ip: "192.168.56.110"
    k3s_token: "token"

  tasks:
    - name: Install K3S in server mode
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_EXEC: "server --node-ip={{ server_ip }}"
        K3S_KUBECONFIG_MODE: "644"
        K3S_TOKEN: "{{ k3s_token }}"
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Wait for master node API Server
      ansible.builtin.command: kubectl get nodes
      register: master_status
      until: master_status.rc == 0 and 'Ready' in master_status.stdout
      retries: 30
      delay: 2
      changed_when: false

- name: "Config worker"
  hosts: worker
  become: true

  vars:
    server_ip: "192.168.56.110"
    worker_ip: "192.168.56.111"
    k3s_token: "token"

  tasks:
    - name: Wait for API Server
      ansible.builtin.wait_for:
        host: "{{ server_ip }}"
        port: 6443
        delay: 2
        timeout: 120

    - name: Install k3s in agent mode
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      environment:
        K3S_URL: "https://{{ server_ip }}:6443"
        INSTALL_K3S_EXEC: "agent --node-ip={{ worker_ip }}"
        K3S_TOKEN: "{{ k3s_token }}"
      args:
        creates: /etc/systemd/system/k3s-agent.service
